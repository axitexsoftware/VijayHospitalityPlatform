{% macro calendar() %}<details class="rate-calendar" data-price-calendar><summary>Explore nightly prices</summary><div class="rate-calendar-body"><div class="rate-calendar-head"><button type="button" class="btn sm plain" data-calendar-prev aria-label="Previous month">‹</button><strong data-calendar-month></strong><button type="button" class="btn sm plain" data-calendar-next aria-label="Next month">›</button></div><div class="rate-calendar-grid" data-calendar-grid role="grid"></div><p class="muted" data-calendar-message aria-live="polite">Choose a room type to view nightly prices. Peak dates are marked with a dot.</p></div></details>{% endmacro %}
{% macro bar(f,cats,today,action='/search') %}<form class="sbar" id="room-search" method="get" action="{{action}}">
<label>Check-in<input type="date" name="ci" id="ci" min="{{today}}" value="{{f.ci}}" required></label><label>Check-out<input type="date" name="co" data-after="ci" min="{{today}}" value="{{f.co}}" required></label>
{{calendar()}}
<label>Adults<input type="number" name="adults" min="1" max="12" value="{{f.adults or 2}}" style="width:80px"></label><label>Children<input type="number" name="children" min="0" max="12" value="{{f.children or 0}}" style="width:80px"></label><label>Rooms<input type="number" name="rooms" min="1" max="10" value="{{f.rooms or 1}}" required></label>
<label>Room type<select name="cat"><option value="">Any</option>{% for c in cats %}<option value="{{c.id}}" {{'selected' if f.cat|string==c.id|string}}>{{c.pname}}: {{c.name}}</option>{% endfor %}</select></label>
<label>Budget per night (₹)<input type="number" name="budget" min="0" value="{{f.budget}}" style="width:110px" placeholder="Optional"></label><button class="btn" type="submit" data-search-submit><span data-search-label>Search rooms</span><span class="search-spinner" aria-hidden="true" hidden></span></button><span class="search-loading" role="status" aria-live="polite" hidden>Checking available rooms and rates…</span></form>{% endmacro %}
